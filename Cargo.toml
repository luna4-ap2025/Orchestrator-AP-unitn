[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# ========== Common game library ==========
common-game = "3.0.0"

# ========== Channel communication ==========
crossbeam-channel = "0.5"

# ========== Logging ==========
log = "0.4"
env_logger = "0.11"

# ========== CLI parsing ==========
serde = { version = "1.0.228", features = ["derive"] }

# ========== Random number generation ==========
rand = "0.9"

# ========== Planets as Dependencies ==========
orbitron = { git = "https://github.com/Advanced-Programming-2025-Orbitron/Orbitron.git" }
skycartel = { git = "https://github.com/0TH08/Skycartel.git" }
rustrelli = { git = "https://github.com/Rustrelli/rustrelli.git"}
the-compiler-strikes-back = { git = "https://github.com/TheCompilerStrikesBackAP2025/TheCompilerStrikesBack.git"}
planet = { git = "https://github.com/crabtorio/crabtorio.git"}
Planet = { git = "https://github.com/Houston-we-have-a-borrow/Planet.git"}
enterprise = { git = "https://github.com/Thompspsps/Enterprise_planet.git"}

# ========== Explorers as Dependencies ==========
explorer_astronaut = { git = "https://github.com/vivis2kuni/explorer_viviana.git"}

# ========== GUI Dependencies (OPTIONAL) ==========
bevy = { version = "0.13", optional = true }
bevy_egui = { version = "0.25", optional = true }

[features]
default = []
gui = ["bevy", "bevy_egui"]

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[[bin]]
name = "orchestrator-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]