[package]
name = "Orchestrator"
version = "0.1.0"
edition = "2024"
description = "Orchestrator for the space simulation game"
license = "MIT"

[dependencies]
common-game = "3.0.0-rc.1"
crossbeam-channel = "0.5"
thiserror = "2.0"
petgraph = "0.8.3"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
lazy_static = "1.4"
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
bevy = "0.13"

[lib]
name = "Orchestrator"
path = "src/lib.rs"